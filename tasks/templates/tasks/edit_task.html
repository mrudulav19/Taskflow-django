
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Task | TaskFlow</title>
    <link rel="stylesheet" href="{% static 'tasks/style.css' %}">
</head>
<body>
    <header>
        <h1>TaskFlow</h1>
    </header>

    <main>
        <section class="page-heading">
            <h2>Edit Task</h2>
            <p>Update the details and keep your project on track.</p>
        </section>

        <section class="panel">
            <form method="post">
                {% csrf_token %}

                {{ form.as_p }}

                <div class="actions">
                    <button type="submit" class="btn btn-primary">
                        Save Changes
                    </button>

                    <a href="{% url 'dashboard' %}" class="btn btn-secondary">
                        Cancel
                    </a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
